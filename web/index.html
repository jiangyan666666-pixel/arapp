<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>放不放得下 · iPhone</title>
  <style>
    :root { color-scheme: dark; --fg: #f2f2f2; --muted: #a8a8a8; --accent: #ffb454; --card: #161616; --line: #333; --ok: #7bd88f; --bad: #ff8a80; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #000; color: var(--fg); }
    body {
      font: 16px/1.55 -apple-system, system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif;
      padding: max(18px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
      max-width: 560px; margin: 0 auto;
    }
    h1 { font-size: 21px; margin: 0 0 4px; }
    h2 { font-size: 17px; margin: 18px 0 8px; }
    p { margin: 0 0 12px; }
    .muted { color: var(--muted); font-size: 14px; }
    .hidden { display: none !important; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    label { display: block; margin: 0 0 12px; }
    label > span { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
    input[type=number], input[type=text], select, textarea {
      width: 100%; font: inherit; font-size: 16px; padding: 10px; background: #0d0d0d; color: var(--fg);
      border: 1px solid #444; border-radius: 8px;
    }
    textarea { min-height: 64px; }
    details { margin-bottom: 12px; }
    summary { color: var(--muted); font-size: 14px; padding: 6px 0; }
    .row { display: flex; gap: 10px; }
    .row > label { flex: 1; }
    button, .btn {
      font: inherit; font-size: 16px; color: var(--fg); background: #262626; border: 1px solid #4a4a4a;
      border-radius: 10px; padding: 12px 14px; min-height: 48px; width: 100%; margin: 0 0 8px; text-align: center;
      text-decoration: none; display: block; -webkit-tap-highlight-color: transparent;
    }
    button.primary, .btn.primary { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
    button[disabled] { opacity: 0.4; }
    button.small { min-height: 40px; padding: 8px 10px; font-size: 14px; }
    .choice { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .choice button { margin: 0; flex: 1 1 40%; }
    .choice button.on { border-color: var(--accent); color: var(--accent); background: #3a2a10; font-weight: 600; }
    .error { color: var(--bad); min-height: 1em; margin-bottom: 8px; }

    #progress { font-size: 13px; color: var(--muted); }
    #phase-title { font-size: 20px; font-weight: 700; margin: 2px 0 2px; }
    #instr-line { font-size: 14px; color: var(--muted); margin-bottom: 10px; }
    #phase-text { margin: 0; }
    .reminder { border-color: #6b4f22; background: #1d160b; font-size: 15px; }
    .reminder b { color: var(--accent); }
    .ar { display: flex; gap: 14px; align-items: center; }
    .ar a { flex: none; display: block; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
    .ar a.busy { opacity: 0.35; pointer-events: none; }
    .ar img { display: block; width: 72px; height: 144px; }
    .ar .tap { color: var(--accent); font-weight: 600; font-size: 18px; }
    #answer.locked { opacity: 0.35; pointer-events: none; }
    .conf-val { color: var(--accent); }
    input[type=range] { width: 100%; height: 36px; }

    table { width: 100%; border-collapse: collapse; margin-bottom: 8px; font-size: 15px; }
    td, th { padding: 6px 4px; border-bottom: 1px solid #262626; text-align: left; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    ul { padding-left: 20px; }
    #csv-text { font-family: ui-monospace, Menlo, monospace; font-size: 12px; min-height: 120px; -webkit-user-select: text; user-select: text; }
  </style>
</head>
<body>
  <!-- ───────── block setup ───────── -->
  <section id="setup">
    <h1>放不放得下 · iPhone 自测</h1>
    <p class="muted">一组 = 同一空隙、同一模型、同一指令，宽度随机 n 次。每次先「第一眼」判断，再「仔细看」后判断。家具宽度不会显示在任何地方。</p>
    <p id="no-ar" class="error hidden">这个浏览器不支持 AR Quick Look（只有 iPhone 的 Safari 支持）。在这里只能走一遍流程。</p>

    <div id="resume" class="card hidden">
      <p id="resume-text"></p>
      <button id="btn-resume" class="primary">继续这一组</button>
      <button id="btn-abandon" class="small">放弃这一组（已答的会保留）</button>
    </div>

    <div class="row">
      <label><span>空隙宽度 W（cm，卷尺量）</span><input id="f-w" type="number" inputmode="decimal" min="20" max="300" step="0.5" placeholder="例如 82" /></label>
      <label><span>试次数</span><input id="f-n" type="number" inputmode="numeric" min="1" max="60" value="10" /></label>
    </div>
    <label><span>模型</span><select id="f-model"></select></label>
    <label><span>家具位置</span>
      <select id="f-place">
        <option value="manual">手动：自己把家具拖进空隙</option>
      </select>
    </label>
    <label><span>这一组「仔细看」时的指令（只是标签，不是功能）</span>
      <select id="f-instr">
        <option value="A">A 只用眼睛看（不伸手）</option>
        <option value="B">B 手伸进画面当尺子</option>
        <option value="C">C 走进空隙</option>
        <option value="other">其他（在备注里写）</option>
      </select>
    </label>
    <label><span>备注（空隙在哪、用的什么纸箱、量的是哪个高度…）</span><input id="f-note" type="text" /></label>
    <details>
      <summary>高级</summary>
      <label><span>宽度随机</span>
        <select id="f-rand">
          <option value="discrete5">离散五档 W−6 / −3 / 0 / +3 / +6 cm（每档等量）</option>
          <option value="continuous">连续 ±6 cm</option>
        </select>
      </label>
    </details>
    <div id="setup-error" class="error"></div>
    <button id="btn-start" class="primary">开始一组</button>
    <button id="btn-data">查看 / 导出数据</button>
    <button id="btn-check" class="small">上机检查</button>
    <button id="btn-server" class="small hidden">换电脑地址</button>
    <p id="ver" class="muted" style="font-family: ui-monospace, Menlo, monospace; font-size: 12px; margin-top: 10px"></p>
  </section>

  <!-- ───────── one trial ───────── -->
  <section id="trial" class="hidden">
    <div id="progress"></div>
    <div id="phase-title"></div>
    <div id="instr-line"></div>
    <div class="card"><p id="phase-text"></p></div>

    <div class="card reminder">
      <b>保持 100%：</b>不要两指捏合。出现百分比就调回 100%（会震一下），或者退出重新打开。
    </div>

    <div class="card ar">
      <a id="ar-link" rel="ar" href="#" class="busy"><img id="ar-img" src="/ar/shelf.svg" alt="家具" /></a>
      <div>
        <div id="ar-status" class="tap">准备模型…</div>
        <div class="muted">点左边的图打开 AR。</div>
      </div>
    </div>

    <div id="answer" class="card locked">
      <div class="choice" id="c-answer">
        <button data-v="fits">放得下</button>
        <button data-v="nofit">放不下</button>
      </div>
      <label>把握 <b class="conf-val" id="conf-val">75</b>%<input id="f-conf" type="range" min="50" max="100" step="5" value="75" /></label>

      <div id="final-only">
        <span class="muted">刚才是怎么看的？（可多选）</span>
        <div class="choice" id="c-strat">
          <button data-v="side">绕到侧面</button>
          <button data-v="closer">走近看</button>
          <button data-v="back">退远看</button>
          <button data-v="hand">伸手比</button>
          <button data-v="top">从上往下看</button>
          <button data-v="none">都没有</button>
        </div>
        <span class="muted">这次缩放过吗？</span>
        <div class="choice" id="c-scaled">
          <button data-v="no">没有，一直 100%</button>
          <button data-v="yes">缩放过</button>
        </div>
        <label><span>一句观察（可空）</span><textarea id="f-remark" rows="2" placeholder="哪里卡住、画面装不下、不得不退远、手和边对不上…"></textarea></label>
      </div>

      <button id="btn-next" class="primary" disabled>记下第一眼</button>
    </div>

    <button id="btn-end" class="small">结束这一组…</button>
  </section>

  <!-- ───────── block summary ───────── -->
  <section id="summary" class="hidden">
    <h1>这一组的小结</h1>
    <p class="muted">只看，不要回头改答案。先发送或导出，再开始下一组。</p>
    <div id="summary-body"></div>
    <button id="btn-sum-send" class="primary">发送到电脑</button>
    <p id="sum-send-status" class="muted"></p>
    <button id="btn-sum-json">导出这一组 JSON</button>
    <button id="btn-sum-csv">导出这一组 CSV</button>
    <button id="btn-sum-back">回到设置</button>
  </section>

  <!-- ───────── stored data ───────── -->
  <section id="data" class="hidden">
    <h1>数据</h1>
    <div id="data-body"></div>
    <button id="btn-send-all" class="primary">把全部数据发送到电脑</button>
    <p id="send-status" class="muted"></p>
    <button id="btn-export-json">导出全部 JSON</button>
    <button id="btn-export-csv">导出全部 CSV</button>
    <button id="btn-show-csv">显示 CSV 文本（下载不了时复制用）</button>
    <textarea id="csv-text" class="hidden" readonly></textarea>
    <button id="btn-data-back">回到设置</button>
    <button id="btn-clear" class="small">清空本机数据…</button>
  </section>

  <script type="module" src="/src/iphone-app.js"></script>
</body>
</html>
