<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>上机检查</title>
  <style>
    :root { color-scheme: dark; --fg: #f2f2f2; --muted: #a8a8a8; --accent: #ffb454; --card: #161616; --line: #333; --ok: #7bd88f; --bad: #ff8a80; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #000; color: var(--fg); }
    body {
      font: 16px/1.55 -apple-system, system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif;
      padding: max(18px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
      max-width: 560px; margin: 0 auto;
    }
    h1 { font-size: 21px; margin: 0 0 4px; }
    p { margin: 0 0 12px; }
    .muted { color: var(--muted); font-size: 14px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
    .step { display: flex; gap: 12px; align-items: flex-start; }
    .mark { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: #262626; color: var(--muted); }
    .step.ok .mark { background: #183d22; color: var(--ok); }
    .step.bad .mark { background: #3d1818; color: var(--bad); }
    .step .title { font-weight: 600; }
    .step .detail { color: var(--muted); font-size: 14px; word-break: break-all; }
    .step.bad .detail { color: var(--bad); }
    button {
      font: inherit; font-size: 16px; color: var(--fg); background: #262626; border: 1px solid #4a4a4a;
      border-radius: 10px; padding: 12px 14px; min-height: 48px; width: 100%; margin: 8px 0 0; -webkit-tap-highlight-color: transparent;
    }
    button.primary { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
    #verdict { font-size: 18px; font-weight: 700; }
    #verdict.ok { color: var(--ok); }
    #verdict.bad { color: var(--bad); }
    .ver { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted); margin-top: 14px; }
  </style>
</head>
<body>
  <h1>阶段 1 · 上机检查</h1>
  <p class="muted">大约 1 分钟。前四项自动检查；第 5 项要点一下按钮。结果会自动发到电脑。</p>

  <div id="steps"></div>

  <div class="card">
    <div id="verdict">检查中…</div>
    <div id="verdict-detail" class="muted"></div>
  </div>

  <button id="btn-again">再测一次</button>
  <button id="btn-back">回到试次页</button>
  <div class="ver" id="ver"></div>

  <script type="module" src="/src/check.js"></script>
</body>
</html>
