<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" href="data:," />
  <title>阶段 3 · 上机检查</title>
  <style>
    :root { color-scheme: dark; --fg: #f2f2f2; --muted: #b4b4b4; --accent: #ffb454; --line: #444; --ok: #7bd88f; --bad: #ff8a80; }
    * { box-sizing: border-box; }
    /* Black until the AR camera runs; then transparent, so the native AR picture under the page shows. */
    html, body { margin: 0; height: 100%; background: #000; color: var(--fg); overflow: hidden; }
    html.ar, html.ar body { background: transparent; }
    body { font: 16px/1.5 -apple-system, system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif; -webkit-user-select: none; user-select: none; }
    .hidden { display: none !important; }

    /* Taps on the picture (outside the panel) land here. */
    #tap { position: fixed; inset: 0; touch-action: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    /* The hand drawn by the page itself, above the AR picture (the real hand cannot hide it). */
    #overlay { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; pointer-events: none; }
    html:not(.ar) #overlay { display: none; }

    #hud {
      position: fixed; left: 0; right: 0; top: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      padding: max(10px, env(safe-area-inset-top)) 12px 8px; pointer-events: none;
      z-index: 4; /* above the panel (full screen while AR is off), under the toast */
    }
    .pill { background: rgba(0, 0, 0, 0.62); border-radius: 999px; padding: 5px 11px; font-size: 13px; }
    .pill.warn { color: var(--accent); }
    .pill.good { color: var(--ok); }
    .pill.bad { color: var(--bad); }
    button.pill { pointer-events: auto; color: var(--fg); border: 1px solid #777; min-height: 34px; width: auto; margin: 0; font-size: 13px; }
    button.pill.on { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }

    #toast {
      position: fixed; left: 16px; right: 16px; top: 18%; z-index: 5; text-align: center; background: rgba(0, 0, 0, 0.78);
      border-radius: 12px; padding: 12px 14px; pointer-events: none;
    }

    #panel {
      position: fixed; left: 0; right: 0; bottom: 0; max-height: 62%; display: flex; flex-direction: column;
      background: rgba(12, 12, 12, 0.84); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0;
      padding: 10px 14px max(12px, env(safe-area-inset-bottom));
    }
    html:not(.ar) #panel { max-height: 100%; top: 0; border-radius: 0; background: #000; padding-top: max(52px, calc(env(safe-area-inset-top) + 40px)); }
    #panel-head { display: flex; align-items: center; gap: 10px; }
    #step-no { flex: none; font-size: 13px; color: var(--muted); }
    #step-title { flex: 1; font-weight: 700; font-size: 17px; }
    #btn-fold { flex: none; width: auto; min-height: 34px; padding: 4px 12px; margin: 0; font-size: 14px; }
    html:not(.ar) #btn-fold { display: none; }
    #panel-body { overflow-y: auto; -webkit-overflow-scrolling: touch; margin-top: 6px; }
    #panel.folded #panel-body { display: none; }
    #step-text { font-size: 15px; margin-bottom: 10px; }
    #step-text p { margin: 0 0 8px; }
    #step-live:empty { display: none; }
    #step-live { margin-bottom: 10px; }
    .muted { color: var(--muted); font-size: 13px; }
    .okc { color: var(--ok); }
    .badc { color: var(--bad); }
    .warnc { color: var(--accent); }
    .line { font-size: 14px; margin: 0 0 6px; }
    .big { font-size: 18px; font-weight: 700; margin: 0 0 6px; }

    button {
      font: inherit; font-size: 16px; color: var(--fg); background: #2a2a2a; border: 1px solid #555;
      border-radius: 10px; padding: 10px 12px; min-height: 46px; width: 100%; margin: 0 0 8px; -webkit-tap-highlight-color: transparent;
    }
    button.primary { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
    button.chosen { background: #24452d; border-color: var(--ok); }
    button[disabled] { opacity: 0.4; }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; min-width: 0; }
    .row > label { font-size: 13px; color: var(--muted); }
    .row.tight { gap: 5px; }
    .row.tight > button { padding: 8px 2px; font-size: 15px; }
    /* a switch: a small label, then its choices in one row */
    .seg { margin: 0 0 4px; }
    .seg-label { font-size: 13px; color: var(--muted); margin-bottom: 2px; }
    .seg .row { gap: 4px; }
    .seg .row > button { padding: 6px 1px; font-size: 14px; min-height: 38px; margin-bottom: 4px; }
    .q { font-size: 14px; margin: 6px 0 2px; }
    input[type=number], input[type=text] {
      width: 100%; font: inherit; font-size: 16px; padding: 9px; margin: 2px 0 8px; background: #0d0d0d; color: var(--fg);
      border: 1px solid #555; border-radius: 8px; -webkit-user-select: text; user-select: text;
    }
    .bar { height: 10px; border-radius: 5px; background: #333; overflow: hidden; margin: 4px 0 8px; }
    .bar > div { height: 100%; background: var(--accent); width: 0; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; margin: 0 0 8px; }
    th, td { border-bottom: 1px solid #333; padding: 3px 4px; text-align: right; white-space: nowrap; }
    th:first-child, td:first-child { text-align: left; }
    th { color: var(--muted); font-weight: 400; }
    tr.current td { color: var(--accent); }
    #nav { display: flex; gap: 8px; margin-top: 4px; }
    #nav button { font-size: 14px; min-height: 38px; padding: 6px 8px; background: transparent; }
    /* The dev server no longer reloads pages by itself (vite.config.js), so a new version of the page needs this. */
    #nav #btn-reload { flex: none; width: auto; font-size: 13px; color: var(--muted); }
    #ver { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--muted); margin-top: 4px; }
  </style>
</head>
<body>
  <div id="tap"></div>
  <canvas id="overlay"></canvas>

  <div id="hud">
    <span id="hud-track" class="pill hidden"></span>
    <span id="hud-hand" class="pill hidden"></span>
    <button id="hud-occ" class="pill hidden"></button>
    <span id="hud-pc" class="pill bad hidden">电脑收不到</span>
  </div>
  <div id="toast" class="hidden"></div>

  <section id="panel">
    <div id="panel-head">
      <div id="step-no"></div>
      <div id="step-title"></div>
      <button id="btn-fold">收起</button>
    </div>
    <div id="panel-body">
      <div id="step-text"></div>
      <div id="step-live"></div>
      <div id="step-controls"></div>
      <div id="nav">
        <button id="btn-prev">上一步</button>
        <button id="btn-skip">跳过</button>
        <button id="btn-reload">刷新页面</button>
      </div>
      <div id="ver"></div>
    </div>
  </section>

  <script type="module" src="/src/check-boot.js"></script>
</body>
</html>
